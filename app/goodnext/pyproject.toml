[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goodnext"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "mcp ~= 1.24.0",
    "strands-agents >= 1.54.0",
    "pydantic >= 2.11",
    
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = ["pytest >= 8.3"]
