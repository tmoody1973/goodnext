name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-tests:
    name: Agent tests (fixture only, no AWS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/goodnext
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q

  agentcore-config:
    name: AgentCore config validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @aws/agentcore@0.28.1
      - run: agentcore validate
